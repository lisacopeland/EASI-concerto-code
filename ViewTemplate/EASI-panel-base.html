		<script type="text/javascript" src="/ViewTemplate/EASI-panel-component-participant-add/js"></script>

		<script type="text/javascript"

		<link rel="stylesheet" type="text/css" href="/ViewTemplate/EASI-panel-component-footer/css" />
		<link rel="stylesheet" type="text/css" href="/ViewTemplate/EASI-panel-component-participant-detail-edit/css" />

		<script type="text/javascript" src="/ViewTemplate/EASI-panel-directive-session-status/js"></script>

		<script type="text/javascript" src="/ViewTemplate/EASI-panel-dialog-participant-add/js"></script>
		<script type="text/javascript" src="/ViewTemplate/EASI-panel-dialog-participant-download/js"></script>
		<script type="text/javascript" src="/ViewTemplate/EASI-panel-dialog-participant-filter/js"></script>
		<script type="text/javascript" src="/ViewTemplate/EASI-panel-dialog-session-add/js"></script>

		<script type="text/javascript">
			testRunner.requires.push('ngMaterial');
			testRunner.requires.push('ngMessages');
			testRunner.requires.push('md.data.table');
			testRunner.requires.push('ngRoute');

			testRunner.config(function ($mdThemingProvider) {
				$mdThemingProvider.theme('default').accentPalette('deep-purple');
			});

			testRunner.config(function ($mdDateLocaleProvider) {
				$mdDateLocaleProvider.formatDate = function (date) {
					return date ? date.toDateString() : '';
				};

				$mdDateLocaleProvider.parseDate = function (dateString) {
					return dateString ? new Date(dateString) : new Date(NaN);
				};

				$mdDateLocaleProvider.isDateComplete = function (dateString) {
					return true;
				};
			});

			testRunner.config(['$routeProvider', function config($routeProvider) {
				$routeProvider.
					when('/about', {
						name: 'about',
						template: '<about></about>'
					}).
					when('/other', {
						name: 'other',
						template: '<other></other>'
					}).
					when('/faq', {
						name: 'faq',
						template: '<faq></faq>'
					}).
					when('/scoring-info', {
						name: 'scoring-info',
						template: '<scoring-info></scoring-info>'
					}).
					when('/instructional-videos', {
						name: 'instructional-videos',
						template: '<instructional-videos></instructional-videos>',
					}).
					when('/admin/edit', {
						name: 'admin-edit',
						template: '<admin-edit></admin-edit>'
					}).
					when('/participant', {
						name: 'participant',
						template: '<participants></participants>'
					}).
					when('/participant/import', {
						name: 'participant',
						template: '<participant-import></participant-import>'
					}).
					when('/participant/add', {
						template: '<participant-add></participant-add>'
					}).
					when('/participant/:id', {
						redirectTo: '/participant/:id/edit'
					}).
					when('/participant/:id/:section', {
						name: 'participant',
						template: '<participant-detail></participant-detail>',
						reloadOnSearch: false
					}).
					when('/participant/:id/:section/:action', {
						name: 'sectionAction',
						template: '<participant-detail></participant-detail>',
						reloadOnSearch: false
					}).
					otherwise('/participant');
			}]);

			testRunner.settings.loaderHtml = "";
		</script>
	</head>

	<body ng-app="testRunner" ng-cloak>
		{{content}}
	</body>

	</html>
</src>
