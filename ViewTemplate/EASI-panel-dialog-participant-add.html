<src>
	<md-dialog>
		<form ng-cloak="">
			<md-toolbar>
				<div class="md-toolbar-tools">
					<h2>{{'panel_client_adding'|trans}}</h2>
				</div>
			</md-toolbar> 
			<md-dialog-content>
			<div class="md-dialog-content">
				<md-input-container> 
					<label>{{'panel_client_id'|trans}}</label>
					<input ng-model="participant.customId" />
				</md-input-container>
			</div>
			</md-dialog-content> 
			<md-dialog-actions layout="row" layout-align="end"> 
				<md-button ng-click="cancel()"> {{'cancel'|trans}} </md-button> 
				<md-button ng-click="add()"> {{'add'|trans}} </md-button> 
			</md-dialog-actions>
		</form>
	</md-dialog>
</src>
